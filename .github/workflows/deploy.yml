name: deploy

# Every push to main deploys to the VM over SSH:
# pull the commit, rebuild the images on the VM, restart the stack.
# Secrets: VM_HOST, VM_USER, VM_SSH_KEY (private key whose public half is in
# ~/.ssh/authorized_keys on the VM). Runtime config lives in ~/HackX4Dashboard/.env
# on the VM and is not touched by CI.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd ~/HackX4Dashboard
            git remote set-url origin "https://github.com/${{ github.repository }}.git"
            git fetch origin main
            git reset --hard ${{ github.sha }}
            test -f .env || { echo "missing ~/HackX4Dashboard/.env on the VM"; exit 1; }
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker compose ps
